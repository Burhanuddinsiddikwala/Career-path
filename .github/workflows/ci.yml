name: CareerPath AI CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Unit & Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt gunicorn

      - name: Run Backend Unit & API Tests
        working-directory: ./backend
        run: python test_backend.py

      - name: Run End-to-End User Journey Tests
        working-directory: ./backend
        run: python test_e2e_journey.py

      - name: Run Career Matching Evaluation Harness
        working-directory: ./backend
        run: python evaluate.py

  frontend-build:
    name: Frontend Production Build (Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install --ignore-scripts

      - name: Run Vite Production Build
        working-directory: ./frontend
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f frontend/dist/index.html || exit 1
          echo "Frontend production bundle generated successfully."
