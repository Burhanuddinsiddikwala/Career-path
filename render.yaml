services:
  - type: web
    name: career-path-server
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt gunicorn
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 app:app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://career-path-six-gamma.vercel.app
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: careerpath.db
      - key: TOKEN_EXPIRY_DAYS
        value: "7"
